<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Food Log</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #fafafa;
      --card: #ffffff;
      --border: #e2e2e2;
      --text: #1a1a1a;
      --muted: #777;
      --accent: #2f6f4f;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #17181a;
        --card: #232427;
        --border: #34363a;
        --text: #eee;
        --muted: #999;
        --accent: #6fbf94;
      }
    }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 24px 16px 80px;
    }
    .wrap { max-width: 720px; margin: 0 auto; }
    h1 { font-size: 1.6rem; margin-bottom: 4px; }
    .sub { color: var(--muted); margin-bottom: 24px; font-size: 0.9rem; }

    #authBar {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
      font-size: 0.85rem;
    }
    #authBar button {
      font-size: 0.8rem;
      padding: 2px 4px;
      border: none;
      background: none;
      color: var(--muted);
      cursor: pointer;
      text-decoration: underline;
      text-underline-offset: 2px;
    }
    #authBar button:hover { color: var(--accent); }

    details.day {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      margin-bottom: 12px;
      overflow: hidden;
    }
    details.day > summary {
      list-style: none;
      cursor: pointer;
      padding: 14px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 600;
    }
    details.day > summary::-webkit-details-marker { display: none; }
    details.day > summary .arrow {
      transition: transform 0.15s ease;
      color: var(--muted);
      font-weight: 400;
    }
    details.day[open] > summary .arrow { transform: rotate(90deg); }
    .day-meta { color: var(--muted); font-weight: 400; font-size: 0.8rem; }

    .meals {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      padding: 0 16px 16px;
    }
    @media (max-width: 480px) {
      .meals { grid-template-columns: 1fr; }
    }
    .meal {
      position: relative;
      border: 1px dashed var(--border);
      border-radius: 8px;
      padding: 10px;
      text-align: center;
    }
    .meal .delete-btn {
      position: absolute;
      top: 6px;
      right: 6px;
      width: 20px;
      height: 20px;
      line-height: 20px;
      border-radius: 50%;
      background: rgba(0,0,0,0.55);
      color: #fff;
      font-size: 0.75rem;
      cursor: pointer;
      border: none;
      z-index: 1;
    }
    .meal .delete-btn:hover { background: #c0392b; }
    .meal h4 {
      margin: 0 0 8px;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
    }
    .meal img {
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
      border-radius: 6px;
      display: block;
      cursor: pointer;
    }
    .meal .placeholder {
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      font-size: 0.8rem;
      border-radius: 6px;
      background: color-mix(in srgb, var(--border) 40%, transparent);
    }
    .meal .upload-row {
      display: flex;
      gap: 6px;
      justify-content: center;
      margin-top: 8px;
    }
    .meal label.upload-btn {
      display: inline-block;
      font-size: 0.75rem;
      padding: 5px 10px;
      border-radius: 6px;
      background: var(--accent);
      color: #fff;
      cursor: pointer;
    }
    .meal button.camera-btn {
      font-family: inherit;
      background: transparent;
      border: 1px solid var(--accent);
      color: var(--accent);
      font-size: 0.75rem;
      padding: 5px 10px;
      border-radius: 6px;
      cursor: pointer;
    }
    .meal input[type="file"] { display: none; }
    .meal .status { font-size: 0.7rem; color: var(--muted); margin-top: 4px; }

    #lightbox {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.85);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 999;
      padding: 24px;
    }
    #lightbox img { max-width: 100%; max-height: 100%; border-radius: 8px; }

    #cameraModal {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.9);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 16px;
      gap: 12px;
    }
    #cameraModal video {
      max-width: 100%;
      max-height: 70vh;
      border-radius: 8px;
    }
    #cameraModal .camera-controls {
      display: flex;
      gap: 12px;
    }
    #cameraModal button {
      font-family: inherit;
      font-size: 0.9rem;
      padding: 10px 20px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
    }
    #cameraModal .snap-btn { background: var(--accent); color: #fff; }
    #cameraModal .cancel-btn { background: #444; color: #fff; }
    #cameraModal .camera-error { color: #eee; font-size: 0.85rem; max-width: 320px; text-align: center; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Food Log</h1>
    <div class="sub">A daily photo log of breakfast, lunch, and dinner.</div>

    <div id="authBar">
      <span id="authStatus" class="sub" style="margin:0;"></span>
      <button id="loginBtn">Login</button>
      <button id="logoutBtn" style="display:none;">Logout</button>
    </div>

    <div id="days"></div>
  </div>

  <div id="lightbox"><img id="lightboxImg" src="" alt="" /></div>

  <div id="cameraModal">
    <video id="cameraVideo" autoplay playsinline muted></video>
    <div id="cameraError" class="camera-error" style="display:none;"></div>
    <div class="camera-controls">
      <button class="snap-btn" id="snapBtn">Take Photo</button>
      <button class="cancel-btn" id="cancelCameraBtn">Cancel</button>
    </div>
  </div>

  <script type="module">
    import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

    // --- Fill these in from your Supabase project settings (Project Settings -> API) ---
    const SUPABASE_URL = "https://kskloplryakymwpfdomh.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_Zm5CToJcnDr5_s456AovYg_v31dVAKS";
    const BUCKET = "foodlog";

    // First day the tracker started. Days from here through today are shown.
    const START_DATE = "2026-07-13";

    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const MEALS = ["breakfast", "lunch", "dinner"];
    let isAuthed = false;

    function dateKey(d) {
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${y}-${m}-${day}`;
    }

    function formatLabel(key) {
      const d = new Date(key + "T00:00:00");
      return d.toLocaleDateString(undefined, { weekday: "long", year: "numeric", month: "long", day: "numeric" });
    }

    function listDaysFromStart() {
      const start = new Date(START_DATE + "T00:00:00");
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      const days = [];
      for (let d = new Date(start); d <= today; d.setDate(d.getDate() + 1)) {
        days.push(dateKey(d));
      }
      return days.reverse(); // most recent first
    }

    async function loadDayData(key) {
      const { data, error } = await supabase.from("foodlog").select("*").eq("day", key).maybeSingle();
      if (error) {
        console.error(error);
        return {};
      }
      return data || {};
    }

    function pathFromUrl(url) {
      const marker = `/object/public/${BUCKET}/`;
      const idx = url.indexOf(marker);
      if (idx === -1) return null;
      return url.slice(idx + marker.length).split('?')[0];
    }

    function mealSlotInnerHTML(dayKey, meal, url) {
      const label = meal.charAt(0).toUpperCase() + meal.slice(1);
      const imgOrPlaceholder = url
        ? `<img src="${url}" alt="${label} on ${dayKey}" data-full="${url}" loading="lazy" />`
        : `<div class="placeholder">No photo</div>`;
      const deleteControl = (url && isAuthed)
        ? `<button class="delete-btn" data-day="${dayKey}" data-meal="${meal}" title="Delete photo">✕</button>`
        : "";
      const uploadControl = (!url && isAuthed)
        ? `<div class="upload-row">
             <label class="upload-btn">Upload
               <input type="file" accept="image/*" data-day="${dayKey}" data-meal="${meal}" />
             </label>
             <button type="button" class="camera-btn" data-day="${dayKey}" data-meal="${meal}">Camera</button>
           </div>`
        : "";
      return `
        ${deleteControl}
        <h4>${label}</h4>
        ${imgOrPlaceholder}
        ${uploadControl}
        <div class="status"></div>`;
    }

    function mealSlotHTML(dayKey, meal, url) {
      return `<div class="meal" data-day="${dayKey}" data-meal="${meal}">${mealSlotInnerHTML(dayKey, meal, url)}</div>`;
    }

    async function renderDays() {
      const daysEl = document.getElementById("days");
      const keys = listDaysFromStart();
      daysEl.innerHTML = keys.map(k => `
        <details class="day" ${k === keys[0] ? "open" : ""} data-day="${k}" data-loaded="false">
          <summary>
            <span>${formatLabel(k)}</span>
            <span class="day-meta"><span class="arrow">▶</span></span>
          </summary>
          <div class="meals" id="meals-${k}"><div class="sub" style="padding:12px 16px;">Loading…</div></div>
        </details>
      `).join("");

      document.querySelectorAll('details.day').forEach(det => {
        det.addEventListener('toggle', onDayToggle);
      });

      // Only the initially-open (most recent) day loads eagerly; the rest
      // load on demand when expanded, so collapsed days never fetch photos.
      if (keys.length) await loadDay(keys[0]);
    }

    async function onDayToggle(e) {
      const det = e.currentTarget;
      if (det.open && det.dataset.loaded !== "true") {
        await loadDay(det.dataset.day);
      }
    }

    async function loadDay(key) {
      const det = document.querySelector(`details.day[data-day="${key}"]`);
      if (!det || det.dataset.loaded === "true") return;
      det.dataset.loaded = "true";
      const row = await loadDayData(key);
      const mealsEl = document.getElementById(`meals-${key}`);
      mealsEl.innerHTML = MEALS.map(m => mealSlotHTML(key, m, row[m])).join("");
      attachHandlers(mealsEl);
    }

    function attachHandlers(root = document) {
      root.querySelectorAll('.meal img').forEach(img => {
        img.addEventListener('click', () => {
          document.getElementById('lightboxImg').src = img.dataset.full;
          document.getElementById('lightbox').style.display = 'flex';
        });
      });
      root.querySelectorAll('.meal input[type="file"]').forEach(input => {
        input.addEventListener('change', handleUpload);
      });
      root.querySelectorAll('.meal .delete-btn').forEach(btn => {
        btn.addEventListener('click', handleDelete);
      });
      root.querySelectorAll('.meal .camera-btn').forEach(btn => {
        btn.addEventListener('click', () => openCamera(btn.dataset.day, btn.dataset.meal));
      });
    }

    function renderMealSlot(mealDiv, dayKey, meal, url) {
      mealDiv.innerHTML = mealSlotInnerHTML(dayKey, meal, url);
      attachHandlers(mealDiv);
    }

    async function handleUpload(e) {
      const file = e.target.files[0];
      if (!file) return;
      const { day, meal } = e.target.dataset;
      await uploadFile(day, meal, file);
    }

    // Resizes + re-encodes an image so the site doesn't ship full
    // camera-resolution files (often several MB) for a small thumbnail.
    function compressImage(fileOrBlob, maxDim = 1280, quality = 0.75) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        const objectUrl = URL.createObjectURL(fileOrBlob);
        img.onload = () => {
          let { width, height } = img;
          if (width > height && width > maxDim) {
            height = Math.round(height * (maxDim / width));
            width = maxDim;
          } else if (height > maxDim) {
            width = Math.round(width * (maxDim / height));
            height = maxDim;
          }
          const canvas = document.createElement('canvas');
          canvas.width = width;
          canvas.height = height;
          canvas.getContext('2d').drawImage(img, 0, 0, width, height);
          URL.revokeObjectURL(objectUrl);
          canvas.toBlob(
            blob => blob ? resolve(blob) : reject(new Error('Compression produced no image')),
            'image/jpeg',
            quality
          );
        };
        img.onerror = reject;
        img.src = objectUrl;
      });
    }

    async function uploadFile(day, meal, file) {
      const mealDiv = document.querySelector(`.meal[data-day="${day}"][data-meal="${meal}"]`);
      const statusEl = mealDiv.querySelector('.status');
      statusEl.textContent = "Compressing…";
      try {
        const compressed = await compressImage(file);
        const path = `${day}/${meal}.jpg`;
        statusEl.textContent = "Uploading…";
        const { error: uploadError } = await supabase.storage
          .from(BUCKET)
          .upload(path, compressed, { upsert: true, contentType: 'image/jpeg' });
        if (uploadError) throw uploadError;

        const { data: pub } = supabase.storage.from(BUCKET).getPublicUrl(path);
        const url = `${pub.publicUrl}?t=${Date.now()}`; // cache-bust on re-upload

        const { error: dbError } = await supabase
          .from("foodlog")
          .upsert({ day, [meal]: url }, { onConflict: "day" });
        if (dbError) throw dbError;

        renderMealSlot(mealDiv, day, meal, url);
      } catch (err) {
        statusEl.textContent = "Upload failed";
        console.error(err);
      }
    }

    // --- Camera capture ---
    const cameraModal = document.getElementById('cameraModal');
    const cameraVideo = document.getElementById('cameraVideo');
    const cameraError = document.getElementById('cameraError');
    const snapBtn = document.getElementById('snapBtn');
    const cancelCameraBtn = document.getElementById('cancelCameraBtn');
    let activeStream = null;
    let pendingShot = null; // { day, meal }

    async function openCamera(day, meal) {
      pendingShot = { day, meal };
      cameraError.style.display = 'none';
      snapBtn.style.display = 'inline-block';
      cameraVideo.style.display = 'block';
      cameraModal.style.display = 'flex';
      try {
        activeStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'environment' }
        });
        cameraVideo.srcObject = activeStream;
      } catch (err) {
        console.error(err);
        cameraVideo.style.display = 'none';
        snapBtn.style.display = 'none';
        cameraError.style.display = 'block';
        cameraError.textContent = "Couldn't access the camera (permission denied or unavailable). Use Upload instead.";
      }
    }

    function closeCamera() {
      if (activeStream) {
        activeStream.getTracks().forEach(t => t.stop());
        activeStream = null;
      }
      cameraModal.style.display = 'none';
      pendingShot = null;
    }

    snapBtn.addEventListener('click', () => {
      if (!pendingShot || !activeStream) return;
      const { day, meal } = pendingShot;
      const canvas = document.createElement('canvas');
      canvas.width = cameraVideo.videoWidth;
      canvas.height = cameraVideo.videoHeight;
      canvas.getContext('2d').drawImage(cameraVideo, 0, 0);
      canvas.toBlob(async (blob) => {
        if (!blob) return;
        const file = new File([blob], `${meal}.jpg`, { type: 'image/jpeg' });
        closeCamera();
        await uploadFile(day, meal, file);
      }, 'image/jpeg', 0.85);
    });

    cancelCameraBtn.addEventListener('click', closeCamera);

    async function handleDelete(e) {
      e.stopPropagation();
      const { day, meal } = e.target.dataset;
      if (!confirm(`Delete the ${meal} photo for ${formatLabel(day)}?`)) return;

      const mealDiv = document.querySelector(`.meal[data-day="${day}"][data-meal="${meal}"]`);
      const img = mealDiv.querySelector('img');
      const statusEl = mealDiv.querySelector('.status');
      statusEl.textContent = "Deleting…";
      try {
        const path = pathFromUrl(img.dataset.full);
        if (path) {
          const { error: removeError } = await supabase.storage.from(BUCKET).remove([path]);
          if (removeError) throw removeError;
        }
        const { error: dbError } = await supabase
          .from("foodlog")
          .update({ [meal]: null })
          .eq("day", day);
        if (dbError) throw dbError;

        renderMealSlot(mealDiv, day, meal, null);
      } catch (err) {
        statusEl.textContent = "Delete failed";
        console.error(err);
      }
    }

    document.getElementById('lightbox').addEventListener('click', () => {
      document.getElementById('lightbox').style.display = 'none';
    });

    // --- Auth ---
    const loginBtn = document.getElementById('loginBtn');
    const logoutBtn = document.getElementById('logoutBtn');
    const authStatus = document.getElementById('authStatus');

    loginBtn.addEventListener('click', async () => {
      const email = prompt("Email:");
      if (!email) return;
      const password = prompt("Password:");
      if (!password) return;
      const { error } = await supabase.auth.signInWithPassword({ email, password });
      if (error) alert("Login failed: " + error.message);
    });

    logoutBtn.addEventListener('click', () => supabase.auth.signOut());

    supabase.auth.onAuthStateChange((_event, session) => {
      isAuthed = !!session;
      loginBtn.style.display = isAuthed ? "none" : "inline-block";
      logoutBtn.style.display = isAuthed ? "inline-block" : "none";
      authStatus.textContent = isAuthed ? `Signed in as ${session.user.email}` : "";
      renderDays();
    });
  </script>
</body>
</html>
